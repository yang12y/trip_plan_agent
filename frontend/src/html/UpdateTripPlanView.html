<div class="container">
  <div v-if="isLoading" class="card loading-card">
    <div class="card-body">
      <div class="loading-spinner">
        <div class="spinner"></div>
        <p>加载中...</p>
      </div>
    </div>
  </div>

  <div v-else-if="!tripPlan" class="card empty-card">
    <div class="card-body">
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <h2>暂无旅行计划</h2>
        <p>您还没有创建旅行计划，请先创建一个旅行计划。</p>
        <router-link to="/trip-plan/create" class="btn btn-primary">
          创建旅行计划
        </router-link>
      </div>
    </div>
  </div>
  
  <div v-else-if="error" class="card error-card">
    <div class="card-body">
      <div class="alert alert-error">
        {{ error }}
      </div>
      <button @click="fetchTripPlan" class="btn btn-primary">
        重试
      </button>
    </div>
  </div>
  
  <div v-else class="card">
    <div class="card-header">
      <h1>更新旅行计划</h1>
      <p class="subtitle">请修改以下信息来更新您的旅行计划</p>
    </div>
    <div class="card-body">
      <form @submit.prevent="updateTripPlan">
        <div class="form-group">
          <label for="userId">用户ID</label>
          <input 
            type="text" 
            id="userId" 
            v-model="formData.user_id" 
            disabled 
            class="form-control"
          />
        </div>
        
        <div class="form-group">
          <label for="destinationCity">目的地城市</label>
          <input 
            type="text" 
            id="destinationCity" 
            v-model="formData.destination_city" 
            class="form-control"
            required
          />
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="numberOfDays">旅行天数</label>
            <input 
              type="number" 
              id="numberOfDays" 
              v-model.number="formData.number_of_days" 
              class="form-control"
              min="1"
              required
            />
          </div>
          
          <div class="form-group">
            <label for="numberOfTravelers">旅行人数</label>
            <input 
              type="number" 
              id="numberOfTravelers" 
              v-model.number="formData.number_of_travelers" 
              class="form-control"
              min="1"
              required
            />
          </div>
        </div>
        
        <div class="form-group">
          <label for="interests">兴趣偏好</label>
          <input 
            type="text" 
            id="interests" 
            v-model="formData.interests" 
            placeholder="用逗号分隔，如：文化,自然,美食" 
            class="form-control"
            required
          />
        </div>
        
        <div class="form-group">
          <label for="accommodationPreference">住宿偏好</label>
          <input 
            type="text" 
            id="accommodationPreference" 
            v-model="formData.accommodation_preference" 
            class="form-control"
            required
          />
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="totalBudget">总预算</label>
            <input 
              type="number" 
              id="totalBudget" 
              v-model.number="formData.total_budget" 
              class="form-control"
              min="0"
              required
            />
          </div>
          
          <div class="form-group">
            <label for="currency">货币类型</label>
            <input 
              type="text" 
              id="currency" 
              v-model="formData.currency" 
              class="form-control"
              placeholder="CNY"
              required
            />
          </div>
        </div>
        
        <button type="submit" :disabled="isUpdating" class="btn btn-primary">
          <span v-if="isUpdating" class="spinner"></span>
          {{ isUpdating ? '更新中...' : '更新旅行计划' }}
        </button>
      </form>
      
      <div v-if="updateSuccess" class="alert alert-success">
        旅行计划更新成功！
        <router-link :to="`/trip-plan/${formData.user_id}`" class="alert-link">查看详情</router-link>
      </div>
      
      <div v-if="error" class="alert alert-error">
        {{ error }}
      </div>
    </div>
  </div>
</div>
